stages:
  - publish

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.multiarch-build:
  stage: publish
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install arm64,amd64
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

publish-backend:
  extends: .multiarch-build
  script:
    - >-
      docker buildx build
      --platform linux/amd64,linux/arm64
      --pull
      --push
      --tag "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
      --tag "$CI_REGISTRY_IMAGE/backend:latest"
      backend

publish-frontend:
  extends: .multiarch-build
  script:
    - >-
      docker buildx build
      --platform linux/amd64,linux/arm64
      --pull
      --push
      --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL"
      --build-arg VITE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY"
      --tag "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
      --tag "$CI_REGISTRY_IMAGE/frontend:latest"
      frontend
