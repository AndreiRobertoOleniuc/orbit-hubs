<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .card { fill:#ffffff; stroke-width:1.5; rx:10; }
      .hdr  { rx:10; }
      .tname { fill:#ffffff; font-size:14px; font-weight:700; }
      .col   { fill:#334155; font-size:11.5px; }
      .pk    { fill:#B45309; font-size:9.5px; font-weight:700; }
      .fk    { fill:#64748B; font-size:9.5px; font-weight:700; }
      .zone  { fill:#94A3B8; font-size:12px; font-weight:700; letter-spacing:1px; }
      .rel   { stroke:#475569; stroke-width:1.6; fill:none; }
      .reld  { stroke:#94A3B8; stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
      .card-divider { stroke-opacity:0.35; stroke-width:1; }
      .muted { fill:#64748B; font-size:10px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="900" fill="#FAFAF8"/>
  <text x="50" y="34" font-size="19" font-weight="700" fill="#1E293B">Orbit — Discovery Engine · Suggested Schema</text>

  <!-- zone headers -->
  <text x="160" y="72" text-anchor="middle" class="zone">SCOPE &amp; IDENTITY</text>
  <text x="550" y="72" text-anchor="middle" class="zone">CORE TIERS (entity → source → chunk)</text>
  <text x="940" y="72" text-anchor="middle" class="zone">SEARCH LIFECYCLE</text>

  <!-- ============ RELATIONSHIPS (drawn first, behind cards) ============ -->
  <!-- hub_memberships -> hubs -->
  <path class="rel" d="M160,270 L160,211" marker-end="url(#arrow)"/>
  <text x="168" y="245" class="muted">∞</text><text x="168" y="225" class="muted">1</text>
  <!-- hub_memberships -> entities -->
  <path class="rel" d="M270,317 L438,360" marker-end="url(#arrow)"/>
  <!-- entity_identifiers -> entities -->
  <path class="rel" d="M270,585 C360,560 380,460 438,432" marker-end="url(#arrow)"/>
  <!-- sources -> entities -->
  <path class="rel" d="M550,515 L550,454" marker-end="url(#arrow)"/>
  <text x="558" y="495" class="muted">∞</text><text x="558" y="475" class="muted">1</text>
  <!-- chunks -> sources -->
  <path class="rel" d="M550,700 L550,669" marker-end="url(#arrow)"/>
  <text x="558" y="692" class="muted">∞</text>
  <!-- chunks -> entities (denormalized) -->
  <path class="reld" d="M440,760 C370,710 372,500 438,442" marker-end="url(#arrow)"/>
  <text x="352" y="612" class="muted" transform="rotate(-90 352 612)">denormalized</text>
  <!-- matches -> entities -->
  <path class="rel" d="M828,366 L662,376" marker-end="url(#arrow)"/>
  <!-- matches -> anfragen -->
  <path class="rel" d="M940,300 L940,230" marker-end="url(#arrow)"/>
  <text x="948" y="280" class="muted">∞</text><text x="948" y="248" class="muted">1</text>
  <!-- match_citations -> matches -->
  <path class="rel" d="M940,560 L940,454" marker-end="url(#arrow)"/>
  <!-- match_citations -> sources -->
  <path class="rel" d="M828,592 L662,610" marker-end="url(#arrow)"/>
  <text x="700" y="590" class="muted">cited = chip</text>

  <!-- ============ SCOPE &amp; IDENTITY (teal) ============ -->
  <!-- hubs -->
  <g>
    <rect class="card" x="50" y="95" width="220" height="114" rx="10" stroke="#0EA5A0"/>
    <path d="M50,105 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#0EA5A0"/>
    <text x="62" y="117" class="tname">hubs</text>
    <line x1="50" y1="123" x2="270" y2="123" stroke="#0EA5A0" class="card-divider"/>
    <text x="62" y="143" class="col">id</text><text x="258" y="143" text-anchor="end" class="pk">PK</text>
    <text x="62" y="162" class="col">slug</text>
    <text x="62" y="181" class="col">name</text>
    <text x="62" y="200" class="col">hub_type</text>
  </g>
  <!-- hub_memberships -->
  <g>
    <rect class="card" x="50" y="270" width="220" height="95" rx="10" stroke="#0EA5A0"/>
    <path d="M50,280 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#0EA5A0"/>
    <text x="62" y="292" class="tname">hub_memberships</text>
    <line x1="50" y1="298" x2="270" y2="298" stroke="#0EA5A0" class="card-divider"/>
    <text x="62" y="318" class="col">entity_id</text><text x="258" y="318" text-anchor="end" class="pk">PK·FK</text>
    <text x="62" y="337" class="col">hub_id</text><text x="258" y="337" text-anchor="end" class="pk">PK·FK</text>
    <text x="62" y="356" class="col">affiliation</text>
  </g>
  <!-- entity_identifiers -->
  <g>
    <rect class="card" x="50" y="560" width="220" height="114" rx="10" stroke="#0EA5A0"/>
    <path d="M50,570 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#0EA5A0"/>
    <text x="62" y="582" class="tname">entity_identifiers</text>
    <line x1="50" y1="588" x2="270" y2="588" stroke="#0EA5A0" class="card-divider"/>
    <text x="62" y="608" class="col">id</text><text x="258" y="608" text-anchor="end" class="pk">PK</text>
    <text x="62" y="627" class="col">entity_id</text><text x="258" y="627" text-anchor="end" class="fk">FK</text>
    <text x="62" y="646" class="col">id_type</text>
    <text x="62" y="665" class="col">id_value</text>
  </g>

  <!-- ============ CORE TIERS (indigo) ============ -->
  <!-- entities -->
  <g>
    <rect class="card" x="440" y="300" width="220" height="152" rx="10" stroke="#5B4FE9"/>
    <path d="M440,310 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#5B4FE9"/>
    <text x="452" y="322" class="tname">entities</text>
    <line x1="440" y1="328" x2="660" y2="328" stroke="#5B4FE9" class="card-divider"/>
    <text x="452" y="348" class="col">id</text><text x="648" y="348" text-anchor="end" class="pk">PK</text>
    <text x="452" y="367" class="col">entity_type</text>
    <text x="452" y="386" class="col">display_name</text>
    <text x="452" y="405" class="col">available_from</text>
    <text x="452" y="424" class="col">latitude / longitude</text>
    <text x="452" y="443" class="col">status</text>
  </g>
  <!-- sources -->
  <g>
    <rect class="card" x="440" y="515" width="220" height="152" rx="10" stroke="#5B4FE9"/>
    <path d="M440,525 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#5B4FE9"/>
    <text x="452" y="537" class="tname">sources</text>
    <line x1="440" y1="543" x2="660" y2="543" stroke="#5B4FE9" class="card-divider"/>
    <text x="452" y="563" class="col">id</text><text x="648" y="563" text-anchor="end" class="pk">PK</text>
    <text x="452" y="582" class="col">entity_id</text><text x="648" y="582" text-anchor="end" class="fk">FK</text>
    <text x="452" y="601" class="col">source_type</text>
    <text x="452" y="620" class="col">source_url · label</text>
    <text x="452" y="639" class="col">provenance · consent</text>
    <text x="452" y="658" class="col">content_hash</text>
  </g>
  <!-- chunks -->
  <g>
    <rect class="card" x="440" y="700" width="220" height="152" rx="10" stroke="#5B4FE9"/>
    <path d="M440,710 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#5B4FE9"/>
    <text x="452" y="722" class="tname">chunks</text>
    <line x1="440" y1="728" x2="660" y2="728" stroke="#5B4FE9" class="card-divider"/>
    <text x="452" y="748" class="col">id</text><text x="648" y="748" text-anchor="end" class="pk">PK</text>
    <text x="452" y="767" class="col">source_id</text><text x="648" y="767" text-anchor="end" class="fk">FK</text>
    <text x="452" y="786" class="col">entity_id</text><text x="648" y="786" text-anchor="end" class="fk">FK</text>
    <text x="452" y="805" class="col">content · section</text>
    <text x="452" y="824" class="col">embedding vector(1024)</text>
    <text x="452" y="843" class="col">fts tsvector</text>
  </g>

  <!-- ============ SEARCH LIFECYCLE (amber) ============ -->
  <!-- anfragen -->
  <g>
    <rect class="card" x="830" y="95" width="220" height="133" rx="10" stroke="#E08600"/>
    <path d="M830,105 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#E08600"/>
    <text x="842" y="117" class="tname">anfragen</text>
    <line x1="830" y1="123" x2="1050" y2="123" stroke="#E08600" class="card-divider"/>
    <text x="842" y="143" class="col">id</text><text x="1038" y="143" text-anchor="end" class="pk">PK</text>
    <text x="842" y="162" class="col">query_text</text>
    <text x="842" y="181" class="col">query_embedding</text>
    <text x="842" y="200" class="col">scope_hub_ids[]</text>
    <text x="842" y="219" class="col">status</text>
  </g>
  <!-- matches -->
  <g>
    <rect class="card" x="830" y="300" width="220" height="152" rx="10" stroke="#E08600"/>
    <path d="M830,310 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#E08600"/>
    <text x="842" y="322" class="tname">matches</text>
    <line x1="830" y1="328" x2="1050" y2="328" stroke="#E08600" class="card-divider"/>
    <text x="842" y="348" class="col">id</text><text x="1038" y="348" text-anchor="end" class="pk">PK</text>
    <text x="842" y="367" class="col">anfrage_id</text><text x="1038" y="367" text-anchor="end" class="fk">FK</text>
    <text x="842" y="386" class="col">entity_id</text><text x="1038" y="386" text-anchor="end" class="fk">FK</text>
    <text x="842" y="405" class="col">score</text>
    <text x="842" y="424" class="col">rationale</text>
    <text x="842" y="443" class="col">claims jsonb</text>
  </g>
  <!-- match_citations -->
  <g>
    <rect class="card" x="830" y="560" width="220" height="76" rx="10" stroke="#E08600"/>
    <path d="M830,570 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v18 h-220 z" fill="#E08600"/>
    <text x="842" y="582" class="tname">match_citations</text>
    <line x1="830" y1="588" x2="1050" y2="588" stroke="#E08600" class="card-divider"/>
    <text x="842" y="608" class="col">match_id</text><text x="1038" y="608" text-anchor="end" class="pk">PK·FK</text>
    <text x="842" y="627" class="col">source_id</text><text x="1038" y="627" text-anchor="end" class="pk">PK·FK</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g>
    <rect x="50" y="710" width="330" height="150" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="66" y="734" font-size="12" font-weight="700" fill="#1E293B">Legend</text>
    <line x1="66" y1="752" x2="106" y2="752" class="rel" marker-end="url(#arrow)"/>
    <text x="116" y="756" class="muted">Foreign key (child → parent it references)</text>
    <line x1="66" y1="776" x2="106" y2="776" class="reld" marker-end="url(#arrow)"/>
    <text x="116" y="780" class="muted">Denormalized / soft reference</text>
    <rect x="66" y="796" width="14" height="14" rx="3" fill="#0EA5A0"/>
    <text x="88" y="807" class="muted">Scope &amp; identity</text>
    <rect x="66" y="818" width="14" height="14" rx="3" fill="#5B4FE9"/>
    <text x="88" y="829" class="muted">Core tiers — searched &amp; ranked</text>
    <rect x="66" y="840" width="14" height="14" rx="3" fill="#E08600"/>
    <text x="88" y="851" class="muted">Search lifecycle — request → result</text>
  </g>
</svg>
