# Only what differs from the defaults in code, plus the credentials the deployment
# passes in under its own names. Every other setting has its default next to the
# code that reads it and can be overridden by environment variable without being
# listed here: orbit.search.rerank-depth → ORBIT_SEARCH_RERANK_DEPTH.
spring:
  application:
    name: backend
  datasource:
    # Local development database (backend/compose.yaml); the deployment sets SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5432/badenconnect
    username: root
    password: 123456789
  flyway:
    # Lets Flyway take over a database that already has tables but no migration history.
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it, never mutates.
      ddl-auto: validate
  servlet:
    multipart:
      # CV and LinkedIn PDFs; the request limit includes multipart overhead.
      max-file-size: 20MB
      max-request-size: 21MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:https://fair-clam-16.clerk.accounts.dev}

clerk:
  azp-origin: ${CLERK_AZP_ORIGIN:http://localhost:5173}

orbit:
  admin:
    # Clerk user ids (sub claim) with admin access, comma-separated.
    user-ids: ${ORBIT_ADMIN_USER_IDS:user_3FEZ7buK8HMqm9R34MuKFmnJ26z}
  openrouter:
    # Serves the LLM, the embedding model and the reranker (models and their settings:
    # OpenRouterProperties).
    api-key: ${OPENROUTER_API_KEY:}
  github:
    token: ${GITHUB_TOKEN:}
  openalex:
    mailto: ${OPENALEX_MAILTO:andreioleniucroberto@gmail.com}
    api-key: ${OPENALEX_API_KEY:}
  zefix:
    user: ${ZEFIX_USER:}
    key: ${ZEFIX_KEY:}
