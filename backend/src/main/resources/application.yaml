spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/badenconnect
    username: root
    password: 123456789
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it, never mutates.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:https://fair-clam-16.clerk.accounts.dev}
  ai:
    model:
      chat: google-genai      # Use Google Gemini for chat (LLM summarization)
      embedding: ollama       # Keep Ollama for embeddings (multilingual-e5-large)
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-2.5-flash-lite
          temperature: 0.3
          max-output-tokens: 500

clerk:
  azp-origin: ${CLERK_AZP_ORIGIN:http://localhost:5173}

orbit:
  admin:
    # Comma-separated Clerk user ids (sub claim) granted admin access to the hub
    # management API. Empty = no admins. Override via ORBIT_ADMIN_USER_IDS.
    user-ids: ${ORBIT_ADMIN_USER_IDS:user_3FEZ7buK8HMqm9R34MuKFmnJ26z}
  search:
    # Minimum best-evidence similarity for a result to count as "sufficient"
    # (below this the frontend prompts to create an Anfrage). See SearchService.
    similarity-threshold: ${ORBIT_SEARCH_SIMILARITY_THRESHOLD:0.80}
    # How many top results get a grounded Gemini rationale (§6.4) — bounds cost.
    rationale-top-n: ${ORBIT_SEARCH_RATIONALE_TOP_N:8}
    rerank:
      # Soft re-rank weights (§6.3) — additive boosts on the normalized base RRF.
      # Kept small so relevance dominates; A/B-able.
      availability-weight: ${ORBIT_SEARCH_RERANK_AVAIL:0.3}
      open-to-requests-weight: ${ORBIT_SEARCH_RERANK_OPEN:0.1}
    # Cross-encoder reranker (Stage 2) — deterministic relevance filtering.
    # Python microservice running BAAI/bge-reranker-v2-m3. Falls back gracefully
    # (returns all candidates unfiltered) if the service is unavailable.
    reranker-url: ${ORBIT_SEARCH_RERANKER_URL:http://localhost:8001}
    reranker-threshold: ${ORBIT_SEARCH_RERANKER_THRESHOLD:0.55}
  embedding:
    # Provider-agnostic embedding config (see EmbeddingProperties). Defaults target a
    # local Ollama serving multilingual-e5-large at 1024 dims; override via env in other
    # environments. Ollama is NOT in compose.yaml — point this at a running instance.
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${EMBEDDING_MODEL:jeffh/intfloat-multilingual-e5-large:f16}
    dimensions: 1024
  github:
    token: ${GITHUB_TOKEN:}
  openalex:
    mailto: ${OPENALEX_MAILTO:andreioleniucroberto@gmail.com}
    api-key: ${OPENALEX_API_KEY:}
  zefix:
    user: ${ZEFIX_USER:}
    key: ${ZEFIX_KEY:}
