spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/badenconnect
    username: root
    password: 123456789
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it, never mutates.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:https://fair-clam-16.clerk.accounts.dev}

clerk:
  azp-origin: ${CLERK_AZP_ORIGIN:http://localhost:5173}

orbit:
  embedding:
    # Provider-agnostic embedding config (see EmbeddingProperties). Defaults target a
    # local Ollama serving multilingual-e5-large at 1024 dims; override via env in other
    # environments. Ollama is NOT in compose.yaml — point this at a running instance.
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${EMBEDDING_MODEL:jeffh/intfloat-multilingual-e5-large:f16}
    dimensions: 1024
  github:
    token: ${GITHUB_TOKEN:}
  llm:
    # Chat model for LLM-based summarization (same Ollama instance as embeddings)
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:gpt-oss:20b-cloud}
    temperature: 0.3
    max-tokens: 500
